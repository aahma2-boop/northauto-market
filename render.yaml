services:
  - type: web
    name: northauto-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: northauto-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeploy: true
